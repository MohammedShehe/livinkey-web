<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVINKEY - Browse PGs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top py-2">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="home.html">
                <img src="assets/logo.png" alt="LIVINKEY logo" height="56" class="me-2" />
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pgs.html">PGs</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <button class="btn btn-download rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#appModal">
                    <i class="bi bi-phone me-1"></i>Download App
                </button>
            </div>
        </div>
    </nav>

    <!-- APP MODAL with QR codes -->
    <div class="modal fade" id="appModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content p-3 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Get the App</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body d-flex flex-column gap-3 pt-3 align-items-center">
                    <div class="app-download-tab text-center">
                        <div class="qr-frame">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://play.google.com/store/apps/details?id=com.livinkey" alt="PlayStore QR" />
                        </div>
                        <a href="#" class="btn btn-dark rounded-pill py-2 w-100"><i class="bi bi-google-play me-2"></i>PlayStore</a>
                    </div>
                    <div class="app-download-tab text-center">
                        <div class="qr-frame">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://apps.apple.com/app/livinkey/id123456789" alt="AppStore QR" />
                        </div>
                        <a href="#" class="btn btn-dark rounded-pill py-2 w-100"><i class="bi bi-apple me-2"></i>AppStore</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container"></div>

    <!-- MAIN CONTENT -->
    <main class="container py-4">
        <div class="d-flex align-items-center gap-3 mb-4 pb-2 border-bottom border-2">
            <img src="assets/logo.png" alt="logo" height="42" />
            <h2 class="fw-bold m-0" style="color: #2b5e1e;">All PGs</h2>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-section p-3 p-md-4 mb-4 rounded-4 shadow-sm">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-semibold small">Search</label>
                    <input type="text" class="form-control form-control-lg rounded-pill" id="searchInput" placeholder="Name or location..." />
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold small">Amenities</label>
                    <select class="form-select rounded-pill" id="amenityFilter">
                        <option value="all">All</option>
                        <option value="wifi">WiFi</option>
                        <option value="ac">AC</option>
                        <option value="security">Security</option>
                        <option value="gym">Gym</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold small">Occupancy</label>
                    <select class="form-select rounded-pill" id="occupancyFilter">
                        <option value="all">All</option>
                        <option value="vacant">Vacant</option>
                        <option value="partially">Partially Occupied</option>
                        <option value="full">Full Occupied</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-search rounded-pill py-2 fw-bold" id="searchBtn"><i class="bi bi-search"></i> Search</button>
                </div>
            </div>
        </div>

        <!-- PG CARDS -->
        <div class="row g-4" id="pgCardContainer">
            <!-- Rendered by JavaScript -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading PGs...</p>
            </div>
        </div>
    </main>

    <!-- DETAIL MODAL -->
    <div class="modal fade" id="pgDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="detailPgName">PG Name</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="detailCarousel" class="carousel slide mb-3" data-bs-ride="carousel">
                        <div class="carousel-inner" id="detailCarouselInner"></div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#detailCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon bg-dark rounded-circle p-2"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#detailCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon bg-dark rounded-circle p-2"></span>
                        </button>
                    </div>
                    <div class="row">
                        <div class="col-md-8">
                            <p><i class="bi bi-geo-alt text-success"></i> <span id="detailLocation">Location</span></p>
                            <p><span class="fw-bold">Rent:</span> ₹<span id="detailRent">0</span>/month</p>
                            <p><span class="fw-bold">Rooms:</span> <span id="detailRooms">0</span> | <span class="fw-bold">Available:</span> <span id="detailAvailable">0</span></p>
                            <p><span class="fw-bold">Amenities:</span> <span id="detailAmenities"></span></p>
                            <hr />
                            <h6 class="fw-bold"><i class="bi bi-chat-left-text"></i> Reviews</h6>
                            <div id="detailReviews" class="small"></div>
                        </div>
                        <div class="col-md-4 d-flex flex-column gap-2">
                            <a href="https://wa.me/919878383497?text=Hi%20LIVINKEY%2C%20I%20want%20to%20book%20this%20PG" target="_blank" class="btn btn-success rounded-pill py-2 fw-bold"><i class="bi bi-whatsapp me-2"></i>Book on WhatsApp</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted py-4 mt-4 border-top">
        <small>© 2022 LIVINKEY · PG Management Punjab</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
