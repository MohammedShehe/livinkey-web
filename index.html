<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIVINKEY - Premium PG Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #FBFBF6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Animated background gradient */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 600px 400px at 20% 80%, rgba(146, 194, 74, 0.08), transparent 60%),
                radial-gradient(ellipse 500px 500px at 80% 20%, rgba(146, 194, 74, 0.06), transparent 50%),
                radial-gradient(ellipse 300px 300px at 50% 50%, rgba(146, 194, 74, 0.04), transparent 70%);
            z-index: 0;
        }
        
        /* Floating decorative elements */
        body::after {
            content: '✦';
            position: absolute;
            font-size: 3rem;
            color: rgba(146, 194, 74, 0.08);
            top: 10%;
            right: 15%;
            animation: floatOrb 8s ease-in-out infinite;
        }
        
        .splash-container {
            text-align: center;
            padding: 2rem;
            animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
        }
        
        .splash-logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2.5rem;
        }
        
        .splash-logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(146, 194, 74, 0.10), transparent 70%);
            animation: logoGlow 3s ease-in-out infinite;
        }
        
        .splash-logo {
            position: relative;
            display: inline-block;
            animation: logoFloat 3s ease-in-out infinite;
        }
        
        .splash-logo img {
            height: 90px;
            width: auto;
            display: block;
            filter: drop-shadow(0 8px 30px rgba(20, 23, 15, 0.08));
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .splash-logo:hover img {
            transform: scale(1.06) rotate(-2deg);
        }
        
        /* Decorative ring around logo */
        .splash-logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -25px;
            border-radius: 50%;
            border: 1.5px solid rgba(146, 194, 74, 0.15);
            animation: ringSpin 20s linear infinite;
        }
        
        .splash-brand {
            font-family: 'Fraunces', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: #14170F;
            letter-spacing: -0.03em;
            margin-top: 0.5rem;
            line-height: 1.1;
        }
        
        .splash-brand span {
            color: #92C24A;
            position: relative;
        }
        
        .splash-brand span::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(146, 194, 74, 0.25);
            border-radius: 4px;
            animation: underlinePulse 2s ease-in-out infinite;
        }
        
        .splash-tagline {
            color: #3A3F32;
            font-weight: 500;
            font-size: 1.05rem;
            margin-top: 0.35rem;
            opacity: 0.7;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        
        /* Decorative line with key icon */
        .splash-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 2rem auto 2.5rem;
            max-width: 280px;
        }
        
        .splash-divider::before,
        .splash-divider::after {
            content: '';
            flex: 1;
            height: 1.5px;
            background: linear-gradient(to right, transparent, rgba(20, 23, 15, 0.12), transparent);
        }
        
        .splash-divider .key-icon {
            font-size: 1.1rem;
            color: #92C24A;
            animation: keyPulse 2.5s ease-in-out infinite;
        }
        
        .dots-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 0;
        }
        
        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            animation: dotBounce 1.6s ease-in-out infinite;
            box-shadow: 0 2px 8px rgba(146, 194, 74, 0.2);
        }
        
        .dot:nth-child(1) {
            animation-delay: 0s;
            background: #5E8A2E;
        }
        
        .dot:nth-child(2) {
            animation-delay: 0.2s;
            background: #92C24A;
        }
        
        .dot:nth-child(3) {
            animation-delay: 0.4s;
            background: #B5D97A;
        }
        
        .splash-loader {
            margin-top: 2.5rem;
            width: 220px;
            height: 3px;
            background: rgba(20, 23, 15, 0.06);
            border-radius: 4px;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
            position: relative;
        }
        
        .splash-loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #92C24A, #5E8A2E, #92C24A);
            border-radius: 4px;
            animation: loadProgress 2.8s ease-in-out forwards, shimmer 1.5s ease-in-out infinite;
            width: 0%;
            background-size: 200% 100%;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .splash-footer {
            position: fixed;
            bottom: 2.5rem;
            left: 0;
            right: 0;
            text-align: center;
            color: #3A3F32;
            font-size: 0.75rem;
            opacity: 0.4;
            font-weight: 500;
            letter-spacing: 0.08em;
            z-index: 1;
        }
        
        .splash-footer span {
            display: inline-block;
            padding: 0 12px;
            position: relative;
        }
        
        .splash-footer span::before,
        .splash-footer span::after {
            content: '·';
            opacity: 0.5;
            margin: 0 4px;
        }
        
        /* Keyframe Animations */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        
        @keyframes logoGlow {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }
        
        @keyframes ringSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes keyPulse {
            0%, 100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.2) rotate(15deg);
            }
        }
        
        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }
        
        @keyframes loadProgress {
            0% { width: 0%; }
            30% { width: 40%; }
            60% { width: 75%; }
            90% { width: 95%; }
            100% { width: 100%; }
        }
        
        @keyframes underlinePulse {
            0%, 100% {
                opacity: 0.25;
                transform: scaleX(1);
            }
            50% {
                opacity: 0.6;
                transform: scaleX(1.1);
            }
        }
        
        @keyframes floatOrb {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(-20px, -30px) rotate(120deg);
            }
            66% {
                transform: translate(20px, -15px) rotate(240deg);
            }
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .splash-brand {
                font-size: 2rem;
            }
            .splash-logo img {
                height: 65px;
            }
            .dot {
                width: 13px;
                height: 13px;
            }
            .splash-loader {
                width: 180px;
            }
            .splash-logo-wrapper::after {
                inset: -18px;
            }
            .splash-divider {
                max-width: 200px;
            }
            .splash-footer {
                bottom: 1.5rem;
                font-size: 0.65rem;
            }
            .splash-footer span {
                padding: 0 8px;
            }
            .splash-footer span::before,
            .splash-footer span::after {
                margin: 0 2px;
            }
            body::after {
                font-size: 2rem;
                top: 5%;
                right: 8%;
            }
        }
        
        @media (max-width: 480px) {
            .splash-container {
                padding: 1.5rem 1rem;
            }
            .splash-brand {
                font-size: 1.6rem;
            }
            .splash-logo img {
                height: 55px;
            }
            .splash-tagline {
                font-size: 0.8rem;
                letter-spacing: 0.1em;
            }
            .dot {
                width: 11px;
                height: 11px;
            }
            .splash-loader {
                width: 150px;
            }
            .splash-logo-wrapper {
                margin-bottom: 1.8rem;
            }
            .splash-divider {
                margin: 1.5rem auto 2rem;
                max-width: 160px;
                gap: 10px;
            }
            .splash-divider .key-icon {
                font-size: 0.9rem;
            }
            .splash-footer {
                bottom: 1rem;
                font-size: 0.55rem;
            }
            .splash-footer span {
                padding: 0 4px;
            }
            .splash-footer span::before,
            .splash-footer span::after {
                margin: 0 1px;
            }
            body::after {
                font-size: 1.5rem;
                top: 3%;
                right: 5%;
            }
        }
        
        /* Extra small devices */
        @media (max-width: 360px) {
            .splash-brand {
                font-size: 1.3rem;
            }
            .splash-logo img {
                height: 45px;
            }
            .splash-tagline {
                font-size: 0.7rem;
            }
            .dot {
                width: 9px;
                height: 9px;
                gap: 10px;
            }
            .dots-container {
                gap: 10px;
            }
            .splash-loader {
                width: 120px;
                margin-top: 1.8rem;
            }
        }
        
        /* Landscape phones */
        @media (max-height: 600px) and (orientation: landscape) {
            .splash-container {
                padding: 1rem;
            }
            .splash-logo-wrapper {
                margin-bottom: 1rem;
            }
            .splash-logo img {
                height: 45px;
            }
            .splash-brand {
                font-size: 1.6rem;
                margin-top: 0.2rem;
            }
            .splash-divider {
                margin: 0.8rem auto 1.2rem;
            }
            .splash-loader {
                margin-top: 1.2rem;
                width: 140px;
            }
            .splash-footer {
                bottom: 0.8rem;
            }
            .dots-container {
                gap: 10px;
            }
            .dot {
                width: 10px;
                height: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-logo-wrapper">
            <div class="splash-logo">
                <img src="assets/logo.png" alt="LIVINKEY" />
            </div>
        </div>
        
        <p class="splash-tagline">Premium PG Management</p>
        
        <div class="splash-divider">
            <span class="key-icon">🔑</span>
        </div>
        
        <div class="dots-container">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>
    
    <div class="splash-footer">
        <span>© 2022 LIVINKEY</span> <span>Premium PG Management</span> <span>Punjab</span>
    </div>
    
    <script>
        // Auto-redirect to home after loading
        setTimeout(() => {
            window.location.href = 'home.html';
        }, 3000);
    </script>
</body>
</html>
